<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F3F2EC">
    <title>Redirecting… | TrackWarranty</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap">
    <link rel="stylesheet" href="/site.css">
</head>
<body>
    <main class="invite-wrap" style="min-height:100vh">
        <div class="invite-card">
            <svg viewBox="0 0 100 100" width="64" height="64" style="margin:0 auto" aria-hidden="true"><path d="M22 8h56a10 10 0 0110 10v56L69 92 50 74 31 92 12 74V18A10 10 0 0122 8z" fill="#101114" stroke="#101114" stroke-width="4" stroke-linejoin="round"/><path d="M32 40l12 12 24-24" fill="none" stroke="#D4FF3A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h1 style="font-size:clamp(36px,8vw,52px)">One sec…</h1>
            <p class="sub">Taking you to the right page.</p>
            <div class="loading-spinner" aria-hidden="true"></div>
            <a href="/" class="btn btn-ink btn-lg" id="fallbackLink" style="align-self:center">Continue to TrackWarranty</a>
        </div>
    </main>

    <script>
        // GitHub Pages 404 redirect handler for /invite/CODE URLs
        (function() {
            const path = window.location.pathname;
            const search = window.location.search;
            
            
            // Check if this is an /invite/CODE URL
            const inviteMatch = path.match(/^\/invite\/([A-Z0-9]+)\/?$/i);
            
            if (inviteMatch) {
                const inviteCode = inviteMatch[1];
                console.log('Detected invite code:', inviteCode);
                
                // Build the proper invite.html URL with parameters
                const params = new URLSearchParams(search);
                params.set('code', inviteCode);
                
                const redirectUrl = `/invite.html?${params.toString()}`;
                console.log('Redirecting to:', redirectUrl);
                
                // Update fallback link
                document.getElementById('fallbackLink').href = redirectUrl;
                
                // Redirect after a short delay
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
                
                return;
            }
            
            // Check if this is just /invite (without code)
            if (path === '/invite' || path === '/invite/') {
                const redirectUrl = `/invite.html${search}`;
                console.log('Redirecting to invite page:', redirectUrl);
                
                document.getElementById('fallbackLink').href = redirectUrl;
                
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
                
                return;
            }
            
            // For any other 404, redirect to home page
            console.log('Unknown path, redirecting to home');
            const homeUrl = `/${search}`;
            document.getElementById('fallbackLink').href = homeUrl;
            
            setTimeout(() => {
                window.location.href = homeUrl;
            }, 2000);
        })();
    </script>
</body>
</html>
